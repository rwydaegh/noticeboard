name: noticeboard-workflow
services:
  airflow:
    restart: unless-stopped
    image: apache/airflow:3.1.5-python3.12
    network_mode: host
    user: "${AIRFLOW_UID:-1000}:0"
    env_file: runtime/local.env
    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__API__HOST: 127.0.0.1
      AIRFLOW__API__PORT: "8921"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://127.0.0.1:8921/execution/
      NOTICEBOARD_URL: http://127.0.0.1:8920
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ./runtime/airflow:/opt/airflow
    command: standalone
