name: noticeboard
services:
  app:
    restart: unless-stopped
    profiles: ["app"]
    build: .
    env_file: runtime/local.env
    environment:
      DATABASE_URL: postgresql://noticeboard:${POSTGRES_PASSWORD:-local-noticeboard}@postgres:5432/noticeboard
      OPENSEARCH_URL: http://search:9200
      NOTICEBOARD_PRIVATE: /app/runtime/private
      NOTICEBOARD_LLM_URL: ${NOTICEBOARD_LLM_URL:-}
      NOTICEBOARD_LLM_MODEL: ${NOTICEBOARD_LLM_MODEL:-}
    ports: ["127.0.0.1:${APP_PORT:-8920}:8000"]
    volumes: ["app-runtime:/app/runtime"]
    depends_on:
      postgres: {condition: service_healthy}
      search: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 15s
      retries: 10
  postgres:
    restart: unless-stopped
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: noticeboard
      POSTGRES_USER: noticeboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-noticeboard}
    ports: ["127.0.0.1:55439:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noticeboard"]
      interval: 5s
      retries: 12
  search:
    restart: unless-stopped
    image: opensearchproject/opensearch:3.2.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      bootstrap.memory_lock: "true"
    ulimits:
      memlock: {soft: -1, hard: -1}
      nofile: {soft: 65536, hard: 65536}
    ports: ["127.0.0.1:19239:9200"]
    volumes: ["search:/usr/share/opensearch/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health"]
      interval: 10s
      retries: 18
volumes:
  app-runtime:
  postgres:
  search:
